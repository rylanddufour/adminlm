// Alloy Configuration for AdminLM Monitoring Stack

// Host metrics collection
prometheus.exporter.unix "self" { }

// Scrape host metrics
prometheus.scrape "host" {
    targets = prometheus.exporter.unix.self.targets
    forward_to = [prometheus.relabel.self_host.receiver]
    scrape_interval = "15s"
    scrape_timeout = "10s"
}

// Stamp the AdminLM host's hostname onto every metric so the per-host dashboard
// dropdown has a stable, accurate `host` label. Mirrors the pattern in
// config/alloy/customer-linux.river so the AdminLM-host and customer-host
// alloys label themselves the same way. On Docker this resolves to the
// container hostname (set automatically by dockerd to /etc/hostname of the
// host — `adminlm-host` on .220). On bare-metal customer installs it picks
// up whatever HOSTNAME is set to (often FQDN). To override, pass
// `- HOSTNAME=<name>` on the alloy container's environment block.
prometheus.relabel "self_host" {
    rule {
        target_label = "host"
        replacement  = sys.env("HOSTNAME")
    }

    forward_to = [prometheus.remote_write.metrics.receiver]
}

// Remote write to Prometheus
prometheus.remote_write "metrics" {
    endpoint {
        url = "http://prometheus:9090/api/v1/write"
    }
}

// Docker service discovery
discovery.docker "containers" {
    host = "unix:///var/run/docker.sock"
}

// Collect Docker container logs
loki.source.docker "containers" {
    host = "unix:///var/run/docker.sock"
    targets = discovery.docker.containers.targets
    labels = {
        job = "docker",
        source = "adminlm_host",
    }
    forward_to = [loki.write.docker.receiver]
}

// Collect systemd journal logs
loki.source.journal "systemd" {
    labels = {
        job = "systemd",
        source = "adminlm_host",
    }
    forward_to = [loki.write.systemd.receiver]
}

// Write Docker logs to Loki
loki.write "docker" {
    endpoint {
        url = "http://loki:3100/loki/api/v1/push"
    }
}

// Write systemd logs to Loki
loki.write "systemd" {
    endpoint {
        url = "http://loki:3100/loki/api/v1/push"
    }
}

// ----------------------------------------------------------------------------
// adminlm-ansible-stack (BACKLOG #64, Card 2)
// Tail NDJSON files written by $HOME/.hermes/logs/adminlm-ansible/*.log on
// the host. loki_logger.py appends one NDJSON line per event. The bind
// mount source is chosen so the logs land in a directory the alloy
// container already has mounted (as ${HOME}/.hermes/logs ->
// /var/lib/hermes/logs, see docker-compose.yml alloy service) — this
// avoids adding a new bind mount to the main monitoring stack.
// loki_logger.py writes RFC3339Nano timestamps in the `ts` field, which
// matches alloy's NDJSON parser default (RFC3339Nano).
// ----------------------------------------------------------------------------

local.file_match "adminlm_ansible" {
    path_targets = [{
        __path__ = "/var/lib/hermes/logs/adminlm-ansible/*.log",
        job      = "adminlm-ansible",
        source   = "adminlm_host",
    }]
}

loki.source.file "adminlm_ansible" {
    targets    = local.file_match.adminlm_ansible.targets
    forward_to = [loki.write.adminlm_ansible.receiver]
}

loki.write "adminlm_ansible" {
    endpoint {
        url = "http://loki:3100/loki/api/v1/push"
    }
}

// ----------------------------------------------------------------------------
// adminlm-streamlit-stack (BACKLOG #64, Card 3)
// Tail NDJSON files written by $HOME/.hermes/logs/adminlm-streamlit/*.log on
// the host. loki_logger.py (reused from Card 2 via a symlink) appends one
// NDJSON line per event with a stream identifier like "streamlit". The bind
// mount source is chosen so the logs land in a directory the alloy
// container already has mounted (as ${HOME}/.hermes/logs ->
// /var/lib/hermes/logs, see docker-compose.yml alloy service) — this avoids
// adding a new bind mount to the main monitoring stack. Labels
// {job="adminlm-streamlit", source="adminlm_host"} match the Card 2 pattern.
// ----------------------------------------------------------------------------

local.file_match "adminlm_streamlit" {
    path_targets = [{
        __path__ = "/var/lib/hermes/logs/adminlm-streamlit/*.log",
        job      = "adminlm-streamlit",
        source   = "adminlm_host",
    }]
}

loki.source.file "adminlm_streamlit" {
    targets    = local.file_match.adminlm_streamlit.targets
    forward_to = [loki.write.adminlm_streamlit.receiver]
}

loki.write "adminlm_streamlit" {
    endpoint {
        url = "http://loki:3100/loki/api/v1/push"
    }
}

// ----------------------------------------------------------------------------
// adminlm-infisical-mcp (BACKLOG #94, Phase 5 — read-only agent consumer).
// Tail NDJSON files written by $HOME/.hermes/logs/adminlm-infisical-mcp/*.log
// on the host. loki_logger.py (bind-mounted from adminlm-ansible-stack in the
// infisical-mcp container) appends one NDJSON line per event with stream
// "infisical_mcp". The bind mount source is chosen so the logs land in a
// directory the alloy container already has mounted (as
// ${HOME}/.hermes/logs -> /var/lib/hermes/logs, see docker-compose.yml alloy
// service) — this avoids adding a new bind mount to the main monitoring stack.
// Labels {job="adminlm-infisical-mcp", source="adminlm_host"} match the Card 2
// / Card 3 pattern. Audit fields per BACKLOG #77: {tool, path, secret_key,
// success, user_id, error?} — NEVER secret_value (see server.py _safe_log_event).
// ----------------------------------------------------------------------------

local.file_match "adminlm_infisical_mcp" {
    path_targets = [{
        __path__ = "/var/lib/hermes/logs/adminlm-infisical-mcp/*.log",
        job      = "adminlm-infisical-mcp",
        source   = "adminlm_host",
    }]
}

loki.source.file "adminlm_infisical_mcp" {
    targets    = local.file_match.adminlm_infisical_mcp.targets
    forward_to = [loki.write.adminlm_infisical_mcp.receiver]
}

loki.write "adminlm_infisical_mcp" {
    endpoint {
        url = "http://loki:3100/loki/api/v1/push"
    }
}
