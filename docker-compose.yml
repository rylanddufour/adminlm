# AdminLM Monitoring Stack
# Deploy with: docker compose up -d

services:
  # Time-series Metrics Database
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "0.0.0.0:9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/targets/:/etc/prometheus/targets/:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    restart: unless-stopped

  # Log Aggregation
  loki:
    image: grafana/loki:3.2.0
    container_name: loki
    ports:
      - "0.0.0.0:3100:3100"
    volumes:
      - ./config/loki.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki
    # Override the image default (-config.file=/etc/loki/local-config.yaml,
    # which is the image-bundled config with no retention/compactor/query
    # limits) so loki reads our project-named loki.yml. Without this the
    # mount is silently ignored — see BACKLOG #5.
    command: -config.file=/etc/loki/local-config.yml
    networks:
      - monitoring
    restart: unless-stopped

  # Metrics + Log Collection Agent
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: alloy
    # Pin the container's hostname to "adminlm-host" so that alloy's
    # `sys.env("HOSTNAME")` (used in the `self_host` relabel) returns the
    # canonical AdminLM host label. Without this, Docker defaults the
    # container hostname to the container ID, which would surface in every
    # metric's `host` label and break dashboard templating. The VM's actual
    # OS hostname (e.g. `gstack-iac` on .220 today) is a different concern;
    # the dashboards and per-host relabel contract use `adminlm-host` as
    # the AdminLM host's role-based label.
    hostname: adminlm-host
    ports:
      - "0.0.0.0:12345:12345"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - ./config/alloy.yml:/etc/alloy/config.yml:ro
      - alloy-data:/etc/alloy
      # Mount Hermes logs for collection
      - ${HOME}/.hermes/logs:/var/lib/hermes/logs:ro
      # Mount systemd journal for loki.source.journal (BACKLOG #27)
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    privileged: true
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    command: run --server.http.listen-addr=:12345 --storage.path=/etc/alloy /etc/alloy/config.yml
    networks:
      - monitoring
    restart: unless-stopped

  # Syslog Receiver for Network Devices
  # Port mapping convention (matches config/promtail.yml scrape_configs):
  #   host:514  -> container:514   (network_syslog - network devices, UDP+TCP)
  # Note: 1514 (customer_host_linux, rsyslog) and 2514 (customer_host_windows,
  # NxLog/Snare) were removed 2026-07-19 per BACKLOG #44 Step 10.
  # Customer hosts now push metrics + logs via Grafana Alloy to Prom :9090
  # and Loki :3100 directly. See docs/multi-host-monitoring.md.
  promtail:
    image: grafana/promtail:3.5.2
    container_name: promtail
    ports:
      # Network devices: TCP + UDP. Many switches/APs/firewalls default to UDP syslog.
      - "0.0.0.0:514:514/tcp"
      - "0.0.0.0:514:514/udp"
    volumes:
      - ./config/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    restart: unless-stopped

  # Customer-host Alloy (BACKLOG #44 Step 3) — simulates a customer Linux host
  # running Alloy with config/alloy/customer-linux.river. Reads from the
  # AdminLM host's /proc, /sys, and /var/log/journal (the AdminLM host itself
  # is the pilot — Steps 6/7 will cut real customer hosts over to this same
  # River config, at which point this container is removed). Runs ALONGSIDE
  # the AdminLM-side alloy so both paths produce metrics + logs simultaneously
  # for parity verification (Step 4). Different UI port (12346) to avoid
  # colliding with the existing alloy container on 12345. Pin the
  # container hostname to `adminlm-host` so the pilot's labels match the
  # AdminLM-side alloy in the per-host dashboard (both end up with
  # `host="adminlm-host"`). For real customer Docker installs, drop this
  # override and let Docker resolve from the OS hostname.
  alloy-customer:
    image: grafana/alloy:v1.5.1
    container_name: alloy-customer
    hostname: adminlm-host
    ports:
      - "0.0.0.0:12346:12345"
    volumes:
      # Required for prometheus.exporter.unix to read host metrics
      - /proc:/proc:ro
      - /sys:/sys:ro
      # Required for loki.source.journal
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # The customer River config from Step 1
      - ./config/alloy/customer-linux.river:/etc/alloy/config.river:ro
      - alloy-customer-data:/etc/alloy
    privileged: true
    environment:
      # The container's `host` label resolves to whatever HOSTNAME is set to
      # via alloy's `sys.env("HOSTNAME")` (see config/alloy/customer-linux.river).
      # On .220 the docker daemon auto-sets HOSTNAME to /etc/hostname of the
      # host (`adminlm-host`), so the pilot parity box picks up the same label
      # as the AdminLM-side alloy without an explicit override. For a real
      # customer install, set `- HOSTNAME=<customer-hostname>` (or let Docker
      # resolve it from the OS hostname on bare-metal).
      # Default URLs match the in-network targets (config/alloy/customer-linux.river
      # uses coalesce() to honor these env vars if set).
      - ALLOY_REMOTE_WRITE_URL=http://prometheus:9090/api/v1/write
      - ALLOY_LOKI_URL=http://loki:3100/loki/api/v1/push
    command: run --server.http.listen-addr=:12345 --storage.path=/etc/alloy /etc/alloy/config.river
    networks:
      - monitoring
    restart: unless-stopped

  # Dashboards and Visualization
  grafana:
    image: grafana/grafana:13.0.8
    container_name: grafana
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-polystat-panel
    networks:
      - monitoring
    restart: unless-stopped

  # Blackbox Exporter — HTTP/TCP probes for service health
  # network_mode: host so probes can hit localhost endpoints
  # (Grafana, Loki, Prometheus, Alloy, Hermes Dashboard, MCP servers, Promtail syslog)
  blackbox_exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox_exporter
    network_mode: host
    cap_add:
      - NET_RAW    # BACKLOG #39.5: required for ICMP probing in the blackbox_inventory job
    ports:
      - "0.0.0.0:9115:9115"
    volumes:
      - ./config/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    # Override the image's default --config.file=/etc/blackbox_exporter/config.yml
    # so it reads our project-named blackbox.yml.
    command:
      - '--config.file=/etc/blackbox_exporter/blackbox.yml'
    restart: unless-stopped

  # ----------------------------------------------------------------------
  # AdminLM v1.0 customer-facing services (BACKLOG #64).
  #
  # These three services are always deployed with the main stack — the
  # customer's streamlit + ansible execution UI ships in the same install
  # as the monitoring stack. Customer-vs-operator visibility is governed by
  # authentication (the streamlit login + the operator's local user), not
  # by install flags.
  #
  # Originally introduced via the `docker-compose.v1-private.yml` overlay
  # (removed 2026-08-20 — overlay was an opt-in mechanism that pre-dated
  # the decision to ship AdminLM as one product).
  # ----------------------------------------------------------------------

  # Stock Ansible runtime (BACKLOG #64 Card 2). No exposed port; the
  # runner container (next) does `docker exec` into this one.
  adminlm-ansible:
    build:
      context: ./adminlm-ansible-stack
      dockerfile: adminlm-ansible/Dockerfile
    image: adminlm_adminlm-ansible
    container_name: adminlm-ansible
    networks:
      - monitoring
    volumes:
      - ./adminlm-ansible-stack/playbooks/customer:/ansible/playbooks/customer:rw
      - ./adminlm-ansible-stack/playbooks/generated:/ansible/playbooks/generated:rw
      - ./adminlm-ansible-stack/inventory/static:/ansible/inventory/static:rw
      - ./adminlm-ansible-stack/inventory/generated:/ansible/inventory/generated:rw
      - ./adminlm-ansible-stack/artifacts:/ansible/artifacts:rw
      # Loki log directory. The main alloy container already bind-mounts
      # $HOME/.hermes/logs (read-only) as /var/lib/hermes/logs, so writing
      # to a subdir here is visible to alloy without editing the main
      # compose. See adminlm-ansible-stack/docker-compose.yml comments for
      # the full rationale.
      - ${HOME}/.hermes/logs/adminlm-ansible:/ansible/logs:rw
    restart: unless-stopped

  # FastAPI bridge with /var/run/docker.sock (BACKLOG #64 Card 2). Only
  # container with the docker socket — streamlit talks to this over HTTP
  # instead of mounting the socket itself. No host port.
  adminlm-ansible-runner:
    build:
      context: ./adminlm-ansible-stack
      dockerfile: adminlm-ansible-runner/Dockerfile
    image: adminlm_adminlm-ansible-runner
    container_name: adminlm-ansible-runner
    # BACKLOG #74: expose the runner's /health to host network so the
    # Prometheus blackbox_exporter (which runs on host network with
    # 9115) can probe it. 127.0.0.1-only — same trust model as Hermes
    # Dashboard's port 9119 --insecure. The runner's HMAC-signed /run
    # endpoint stays on the monitoring docker network (not published);
    # /health has no body data, just a status probe. Port 18000 chosen
    # to avoid conflict with grafana-mcp (:8000), inventory-mcp
    # (:8001), and kb-mcp (:8002).
    ports:
      - "127.0.0.1:18000:8000"
    networks:
      - monitoring
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.hermes/logs/adminlm-ansible:/ansible/logs:rw
      - ./adminlm-ansible-stack/loki_logger.py:/app/loki_logger.py:ro
    environment:
      - RUNNER_HMAC_SECRET=${RUNNER_HMAC_SECRET:-dev-secret-rotate-me}
      - ANSIBLE_CONTAINER_NAME=adminlm-ansible
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      adminlm-ansible:
        condition: service_started

  # Customer-facing Streamlit UI (BACKLOG #64 Cards 3-6). Port 8501 is
  # the ONLY host-side port this stack publishes.
  streamlit-ui:
    build:
      context: ./streamlit-ui-stack
      dockerfile: Dockerfile
    image: adminlm_streamlit-ui
    container_name: streamlit-ui
    ports:
      - "0.0.0.0:80:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    volumes:
      - ./streamlit-ui-stack/data:/data/streamlit-ui:rw
      - /home/ansible/.hermes/logs/adminlm-streamlit:/home/ansible/.hermes/logs/adminlm-streamlit:rw
      - ./streamlit-ui-stack/streamlit-app:/app/streamlit-app:ro
      # loki_logger.py is Card 2's shared log-shipper module. The
      # ./streamlit-ui-stack/streamlit-app directory contains a SYMLINK
      # at loki_logger.py pointing to ../../adminlm-ansible-stack/loki_logger.py.
      # On the host that resolves correctly. Inside the container, Python's
      # import machinery can't resolve the symlink's relative target (it
      # crosses a bind-mount boundary), so we mount the file at the
      # resolved path AND set PYTHONPATH below to point at the mounted
      # target dir. We mount JUST this one file (not the whole
      # adminlm-ansible-stack dir) to keep Card 2's other internals out
      # of the streamlit-ui container. Source-of-truth:
      # ~/adminlm/adminlm-ansible-stack/loki_logger.py exists on .220.
      - ./adminlm-ansible-stack/loki_logger.py:/app/adminlm-ansible-stack/loki_logger.py:ro
      - ./adminlm-ansible-stack/playbooks:/ansible/playbooks:ro
      - ./adminlm-ansible-stack/inventory:/ansible/inventory:ro
    environment:
      - STREAMLIT_ADMIN_USERNAME=${STREAMLIT_ADMIN_USERNAME:-admin}
      - STREAMLIT_ADMIN_PASSWORD_HASH=${STREAMLIT_ADMIN_PASSWORD_HASH:-}
      - STREAMLIT_ADMIN_PASSWORD=${STREAMLIT_ADMIN_PASSWORD:-admin}
      - HERMES_URL=${HERMES_URL:-http://host.docker.internal:9119}
      - KB_MCP_URL=${KB_MCP_URL:-http://kb-mcp:8002}
      - INVENTORY_MCP_URL=${INVENTORY_MCP_URL:-http://inventory-mcp:8001}
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
      - ANSIBLE_RUNNER_URL=${ANSIBLE_RUNNER_URL:-http://adminlm-ansible-runner:8000}
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - RUNNER_HMAC_SECRET=${RUNNER_HMAC_SECRET:-dev-secret-rotate-me}
      - ADMINLM_CUSTOMER_NAME=${ADMINLM_CUSTOMER_NAME:-dufour-int}
      # Hermes gateway binds 0.0.0.0:8642 (BACKLOG #66 fix). The
      # API_SERVER_KEY lives in /home/ansible/.hermes/.env on the host;
      # bootstrap.sh reads it and exports it before `docker compose up -d`.
      - HERMES_API_BASE_URL=${HERMES_API_BASE_URL:-http://host.docker.internal:8642/v1}
      - HERMES_API_KEY=${HERMES_API_KEY:?HERMES_API_KEY is required for Agent Chat — bootstrap.sh must source it from /home/ansible/.hermes/.env's API_SERVER_KEY}
      - HERMES_MODEL=${HERMES_MODEL:-minimax/minimax-m3}
      - HERMES_PROFILE=${HERMES_PROFILE:-it_admin}
      - LOKI_LOG_DIR=/home/ansible/.hermes/logs/adminlm-streamlit
      # PYTHONPATH for the bind-mounted loki_logger.py (see volumes
      # block above). Without this, `from loki_logger import log_event`
      # raises ModuleNotFoundError on the Home page (BACKLOG #73 fix).
      - PYTHONPATH=/app/adminlm-ansible-stack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  monitoring:
    name: monitoring        # fixed name so docker-compose.mcp.yml can join as external
    driver: bridge

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  alloy-customer-data:
  grafana-data:
